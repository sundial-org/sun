<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun · Review</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><span class="brand">☀ sun <span>/ review</span></span><span id="revision"></span></header>
<div class="intro"><h1>Current changes</h1><p id="summary" role="status">Loading review…</p></div>
<main><aside><nav id="files" aria-label="Files needing review"></nav><details><summary id="omittedSummary">Checked files omitted</summary><div id="omitted"></div></details></aside>
<section class="review"><div class="toolbar"><h2 id="filename">Choose a file</h2><div class="controls"><label>View <select id="layout"><option value="unified">Unified</option><option value="split">Split</option></select></label><button id="previous" aria-label="Previous file">←</button><span id="position"></span><button id="next" aria-label="Next file">→</button></div></div>
<p id="reason" aria-live="polite"></p><details class="evidence"><summary>Check evidence</summary><pre id="evidence"></pre></details><p id="notice" role="status"></p><div id="diff"></div></section></main>
<footer>Local snapshot · file-level review · unchanged file contents do not guarantee unchanged behavior across files. Reopen the command to refresh.</footer>
</body></html>
